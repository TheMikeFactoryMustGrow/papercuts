name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax
        run: python3 -m py_compile scripts/papercut

      - name: REQUIREMENTS register lint (well-formed rows, unique IDs, fitness metric)
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path
          t = Path("REQUIREMENTS.md").read_text(encoding="utf-8")
          assert "**Fitness metric:**" in t, "register missing fitness metric line"
          rows = [l for l in t.splitlines() if re.match(r"^\|\s*R-[A-Z]+-\d+\s*\|", l)]
          assert rows, "register has no rule rows (| R-XXX-NN | ...)"
          ids = []
          for l in rows:
              # split on unescaped pipes only — GFM allows a literal pipe in a cell as \|
              cells = [c.strip().replace("\\|", "|") for c in re.split(r"(?<!\\)\|", l.strip().strip("|"))]
              assert len(cells) == 5 and all(cells), f"row needs 5 non-empty cells (id/requirement/author/why/enforcement): {l}"
              ids.append(cells[0])
          dupes = {i for i in ids if ids.count(i) > 1}
          assert not dupes, f"duplicate rule IDs: {sorted(dupes)}"
          print(f"register OK: {len(ids)} rules, IDs unique")
          EOF

      - name: Snippet parity (template path + inline-constant fallback)
        run: |
          extract() { awk '/<!-- agent-papercuts:begin -->/{f=1} f{print} /<!-- agent-papercuts:end -->/{f=0}' "$1"; }
          extract templates/AGENTS.snippet.md > /tmp/tpl.txt
          # enable with templates/ present writes the template verbatim
          scratch1="$(mktemp -d)"; git -C "$scratch1" init -q
          ./scripts/papercut -C "$scratch1" enable
          extract "$scratch1/AGENTS.md" | cmp - /tmp/tpl.txt
          # enable without templates/ falls back to the inline AGENTS_SNIPPET
          pkg="$(mktemp -d)/pkg"; cp -rL . "$pkg"; rm -rf "$pkg/templates" "$pkg/.git"
          scratch2="$(mktemp -d)"; git -C "$scratch2" init -q
          "$pkg/scripts/papercut" -C "$scratch2" enable
          extract "$scratch2/AGENTS.md" | cmp - /tmp/tpl.txt

      - name: Behavior smoke (enable → log → resolve → history)
        run: |
          PAPERCUT="$PWD/scripts/papercut"
          tmp="$(mktemp -d)"; cd "$tmp" && git init -q
          "$PAPERCUT" enable
          "$PAPERCUT" status | grep -q '^project_enabled=true$'
          "$PAPERCUT" -m ci "Smoke: enable path works."
          "$PAPERCUT" list | grep -q '(1 total'
          stamp="$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}T[^ ]+' .agent-papercuts/open.md | head -1)"
          "$PAPERCUT" resolve --stamp "$stamp" -n "Smoke resolved."
          "$PAPERCUT" list | grep -q 'empty log'
          grep -q '"event": "logged"'   .agent-papercuts/history.jsonl
          grep -q '"event": "resolved"' .agent-papercuts/history.jsonl

      - name: Regression — stamp-collided entries resolve individually
        run: |
          PAPERCUT="$PWD/scripts/papercut"
          tmp="$(mktemp -d)"; cd "$tmp" && git init -q
          "$PAPERCUT" enable
          printf '%s\n' '' '2026-08-06T03:27:18.616Z - m1 - a1' '' 'First: the SIGPIPE guard bug.' '' '2026-08-06T03:27:18.616Z - m1 - a1' '' 'Second: autostash note, same stamp.' '' >> .agent-papercuts/open.md
          "$PAPERCUT" resolve --contains sigpipe -n "guard fixed"
          "$PAPERCUT" list | grep -q 'Second: autostash note'
          "$PAPERCUT" list | grep -q '(1 total'
          # --index across stamp-siblings resolves BOTH (dedup keys on entry, not stamp)
          tmp2="$(mktemp -d)"; cd "$tmp2" && git init -q
          "$PAPERCUT" enable
          printf '%s\n' '' '2026-08-06T03:27:18.616Z - m1 - a1' '' 'First: the SIGPIPE guard bug.' '' '2026-08-06T03:27:18.616Z - m1 - a1' '' 'Second: autostash note, same stamp.' '' >> .agent-papercuts/open.md
          "$PAPERCUT" resolve --index 1 --index 2 -n "both fixed"
          "$PAPERCUT" list | grep -q 'empty log'

      - name: Regression — spaced model/author normalize to single tokens
        run: |
          PAPERCUT="$PWD/scripts/papercut"
          tmp="$(mktemp -d)"; cd "$tmp" && git init -q
          "$PAPERCUT" enable
          PAPERCUT_AUTHOR='Jane Doe' "$PAPERCUT" -m 'claude opus' "spaced header fields"
          grep -q ' - claude-opus - Jane-Doe$' .agent-papercuts/open.md
          "$PAPERCUT" list | grep -q '(1 total'
